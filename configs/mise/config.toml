[tools]
"cargo:mergiraf" = "latest"
"cargo:selene" = "latest"
"github:docker/docker-language-server" = "latest"
"aqua:modem-dev/hunk" = "latest"
"github:simonwhitaker/gibo" = "latest"
"github:sqls-server/sqls" = "latest"
"npm:@antfu/ni" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:bash-language-server" = "latest"
"pipx:neovim-remote" = "latest"
act = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bat = "latest"
bun = "latest"
cmake = "latest"
delta = "latest"
deno = "latest"
direnv = "latest"
duckdb = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
go = "latest"
herdr = "latest"
jq = "latest"
lua-language-server = "latest"
marp-cli = "latest"
mas = "latest"
neovim = "latest"
node = "22.22.0"
postgres = "15"
python = "3.13.5"
ripgrep = "latest"
ruby = "4.0.2"
rust = "latest"
shellcheck = "latest"
tmux = "latest"
tokei = "latest"
tree-sitter = "latest"
uv = "latest"
xcodes = "latest"
yt-dlp = "latest"
pnpm = "11.5.0"

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]

[dotfiles]
"~/bin" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/bin" }
"~/prh.yml" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/prh/prh.yml" }
"~/.swift-format" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/swift-format/.swift-format" }
"~/.textlintrc" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/textlint/.textlintrc" }
"~/.vim" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/vim" }
"~/.zshenv" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/zsh/.zshenv" }
"~/.config/bundle" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/bundle" }
"~/.config/ctags" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/ctags" }
"~/.config/git" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/git" }
"~/.config/hunk" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/hunk" }
"~/.config/mise" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/mise" }
"~/.config/nvim" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/nvim" }
"~/.config/prh" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/prh" }
"~/.config/rubocop" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/rubocop" }
"~/.config/textlint" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/textlint" }
"~/.config/tig" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/tig" }
"~/.config/tmux" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/tmux" }
"~/.config/trf" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/trf" }
"~/.config/vim" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/vim" }
"~/.config/wezterm" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/wezterm" }
"~/.config/zsh" = { source = "~/ghq/github.com/pupepa/dotfiles/configs/zsh" }


[bootstrap.macos.dock]
# Dockの自動表示
autohide = true
# Dockのアイコンサイズ
tilesize = 60
# Dockのアイコン拡大表示
magnification = false
# Dockに最近使ったアプリを表示
show_recents = false
# 使用状況に応じた操作スペースの自動並び替え
mru_spaces = false
# Dockの表示位置
orientation = "bottom"


[bootstrap.macos.finder]
# Finderにパスバーを表示
show_pathbar = true
# Finderにステータスバーを表示
show_status_bar = true
# ファイルの拡張子を変更した時に警告を表示
show_extensions_warning = false
# Finderのデフォルトの表示形式
preferred_view_style = "list"


[bootstrap.macos.keyboard]
# キーリピートの速度
key_repeat = 2
# キーリピート開始までの待ち時間
initial_key_repeat = 15
# キー長押し時のアクセント文字入力
press_and_hold = false
# F1〜F12キーの標準ファンクションキー動作
fn_state = false


[bootstrap.macos.trackpad]
# トラックパッドのタップによるクリック
tap_to_click = true


[bootstrap.macos.defaults.NSGlobalDomain]
# システムの外観
AppleInterfaceStyle = "Dark"
# ライトモードとダークモードの自動切り替え
AppleInterfaceStyleSwitchesAutomatically = false
# 時刻の24時間表記
AppleICUForce24HourTime = true
# ファイルの拡張子を表示
AppleShowAllExtensions = true
# スクロールバーの表示方法
AppleShowScrollBars = "WhenScrolling"
# 文頭の自動大文字化
NSAutomaticCapitalizationEnabled = false
# ダッシュ記号への自動変換
NSAutomaticDashSubstitutionEnabled = false
# ピリオドの自動入力
NSAutomaticPeriodSubstitutionEnabled = false
# スマート引用符への自動変換
NSAutomaticQuoteSubstitutionEnabled = false
# スペルの自動修正
NSAutomaticSpellingCorrectionEnabled = false
# 保存ダイアログの詳細表示
NSNavPanelExpandedStateForSaveMode = true
# 保存ダイアログの詳細表示
NSNavPanelExpandedStateForSaveMode2 = true
# プリントダイアログの詳細表示
PMPrintingExpandedStateForPrint = true
# プリントダイアログの詳細表示
PMPrintingExpandedStateForPrint2 = true
# スクロール方向
"com.apple.swipescrolldirection" = false
# トラックパッドのポインタ移動速度
"com.apple.trackpad.scaling" = "3"


[bootstrap.macos.defaults."com.apple.finder"]
# 外付けディスクのデスクトップ表示
ShowExternalHardDrivesOnDesktop = true
# リムーバブルメディアのデスクトップ表示
ShowRemovableMediaOnDesktop = true


[bootstrap.macos.defaults."com.apple.dock"]
# Dockの自動表示・非表示アニメーション時間
"autohide-time-modifier" = 0.7
# Mission Control / Exposéのアニメーション時間
"expose-animation-duration" = 0.0
# アプリ起動時のDockアイコンのアニメーション
launchanim = false
# ウインドウ最小化時のエフェクト
mineffect = "scale"
# 最小化したウインドウの格納先
"minimize-to-application" = true
# 起動中アプリのインジケータ表示
"show-process-indicators" = true
# Dockに表示するアプリの範囲
"static-only" = true
